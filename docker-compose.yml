version: "3.8"

services:
  # MySQL / MariaDB database service
  db:
    image: mariadb:11.4
    container_name: catchat-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_secret
      MARIADB_DATABASE: catchat_db
      MARIADB_USER: catbot
      MARIADB_PASSWORD: catbot_secret
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: catchat_db
      MYSQL_USER: catbot
      MYSQL_PASSWORD: catbot_secret
    volumes:
      - db_data:/var/lib/mysql
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u catbot -pcatbot_secret || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  # Node.js backend API
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catchat-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: catbot
      DB_PASSWORD: catbot_secret
      DB_NAME: catchat_db
      ENABLE_ADMIN: ${ENABLE_ADMIN:-true}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6IAbNehlPWTeAuPMauvihEn6gEZMs0yRPpbwReVDmufWw}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "3001:3001"

  # Nginx reverse proxy & static frontend server
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: catchat-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8085:80"

  # phpMyAdmin (Web GUI to view and manage the database)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: catchat-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: catbot
      PMA_PASSWORD: catbot_secret
    ports:
      - "8086:80"

volumes:
  db_data:
