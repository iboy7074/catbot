worker_processes 1;
pid /home/bharath/catbot/data/nginx/nginx.pid;
error_log /home/bharath/catbot/data/nginx/logs/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /home/bharath/catbot/data/nginx/logs/access.log;

  # Store temporary runtime files inside project directory
  client_body_temp_path /home/bharath/catbot/data/nginx/temp/client_body;
  proxy_temp_path       /home/bharath/catbot/data/nginx/temp/proxy;
  fastcgi_temp_path     /home/bharath/catbot/data/nginx/temp/fastcgi;
  uwsgi_temp_path       /home/bharath/catbot/data/nginx/temp/uwsgi;
  scgi_temp_path        /home/bharath/catbot/data/nginx/temp/scgi;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 25M;

  upstream backend {
    server unix:/home/bharath/catbot/data/backend.sock;
  }

  server {
    listen 8085;
    server_name localhost;

    root /home/bharath/catbot;
    index index.html;

    # Forward API requests to the Node.js backend via unix domain socket
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      proxy_connect_timeout 60s;
    }

    # Serve static frontend files
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Deny access to sensitive backend files & directories
    location ~ /(\.env|data|node_modules|\.git) {
      deny all;
      return 404;
    }
  }
}

